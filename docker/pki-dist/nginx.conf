# pki-dist (ADR-024): serves the CA custodian's public directory, read-only, as
# nginx's own unprivileged user (101) on :8090. Everything nginx writes goes to
# /tmp (tmpfs); the rootfs is read-only and no capability is added.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# RFC 5280 4.2.1.13 and 4.2.2.1: DER CRLs and certificates under these types.
	types {
		application/pkix-crl crl;
		application/pkix-cert crt;
	}
	access_log /dev/stdout;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;
	server_tokens off;

	server {
		listen 8090;
		root /var/www/pki;
		location / {
			autoindex on;
			limit_except GET HEAD { deny all; }
		}
	}
}
