worker_processes auto;
# Old workers close what they still hold this long after a reload. Without it they
# keep every open connection until it ends, which for a stream session to an edge
# box (config/nginx/stream/) can be days: a revoked box or client would keep its
# session. Reloads come from CRL changes (crl-renewer, /signals/reload-nginx).
worker_shutdown_timeout 60s;
worker_rlimit_nofile 65536;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Which key signs the /admin/ token (ADR-022): admin-v1 (RS256, the default) or
# admin-v2 (ML-DSA-65). nginx hides the environment from Lua unless named here.
# Read once at start (init_by_lua_block): a change needs a container recreate.
env ADMIN_JWT_KID;

events {
	worker_connections 4096;
	use epoll;
	multi_accept on;
}

http {
	include mime.types;
	default_type application/octet-stream;

	resolver 127.0.0.11 ipv6=off valid=30s;

	# $ssl_curve is the only group variable nginx has, and for a hybrid KEM group
	# it prints the raw IANA code point in hex because nginx's name table holds
	# only classical curves. 0x11ec = 4588 = X25519MLKEM768. Left unmapped, the
	# classical outcome logs a NAME (X25519) and the post-quantum one does not,
	# so any alert searching for X25519MLKEM768 sees zero PQC connections and a
	# tidy X25519 on downgrade: exactly backwards.
	map $ssl_curve $ssl_group_name {
		"0x11ec"  "X25519MLKEM768";
		"0x11eb"  "SecP256r1MLKEM768";
		"0x0200"  "MLKEM512";
		"0x0201"  "MLKEM768";
		"0x0202"  "MLKEM1024";
		default   $ssl_curve;
	}

	# Session resumption, stated explicitly rather than inherited. Measured:
	# a resumed handshake still negotiates X25519MLKEM768 (PSK + (EC)DHE), so
	# ML-KEM confidentiality and harvest-now-decrypt-later protection are intact.
	# What is NOT repeated is ML-DSA verification of the client certificate:
	# within the ticket lifetime, identity comes from the ticket rather than a
	# re-verified post-quantum chain. Revocation is unaffected, policy_router.lua
	# checks $ssl_client_serial against the CRL dict on every request, resumed or
	# not. Left on: the alternative costs a full PQC handshake per connection and
	# would change every latency figure in the paper. The window is bounded here
	# rather than left to the built-in default.
	ssl_session_tickets on;
	ssl_session_timeout 5m;

	log_format pqc_json escape=json
	'{'
	'"ts":"$time_iso8601",'
	'"ip":"$remote_addr",'
	'"cn":"$ssl_client_s_dn",'
	'"serial":"$ssl_client_serial",'
	'"verify":"$ssl_client_verify",'
	'"method":"$request_method",'
	'"uri":"$request_uri",'
	'"status":$status,'
	'"bytes":$body_bytes_sent,'
	'"rt":$request_time,'
	'"proto":"$ssl_protocol",'
	'"cipher":"$ssl_cipher",'
	'"group":"$ssl_group_name",'
	# What the handshake actually negotiated, read from the connection's own SSL
	# object (tls_telemetry.lua). kex is OpenSSL's name for the group, an
	# independent cross-check of "group" above, which is nginx's $ssl_curve
	# through the map at the top of this block. kex_native is $ssl_curve itself:
	# it prints the hybrid group as its codepoint, 0x11ec (= X25519MLKEM768).
	# client_sig/server_sig are EMPTY on a resumed session (resumed="r"): TLS 1.3
	# resumption performs no CertificateVerify, so there is no signature to report.
	# client_key is the type of the key in the client certificate the connection
	# carries. No certificates, keys or tokens are logged.
	'"kex":"$pqc_tls_group",'
	'"kex_native":"$ssl_curve",'
	'"client_sig":"$pqc_tls_client_sig",'
	'"server_sig":"$pqc_tls_server_sig",'
	'"client_key":"$pqc_tls_client_key",'
	'"resumed":"$ssl_session_reused",'
	'"sni":"$ssl_server_name"'
	'}';

	lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";
	lua_package_cpath "/usr/lib/lua/5.1/?.so;;";

	lua_shared_dict pqc_routes 20m;
	# 4m (was 1m), holds far more "revoked_:" CRL entries plus routing/JWT/HMAC
	# metadata before LRU eviction starts silently dropping revocations.
	lua_shared_dict pqc_route_meta 4m;
	lua_shared_dict pqc_rate 10m;
	# Migration listener (config/nginx/migration/, off unless a listener.conf is
	# present): per-client inventory and per-client policy. See lua/migration.lua.
	lua_shared_dict migration_inventory 10m;
	lua_shared_dict migration_policy 1m;
	# Revocations of every CA the migration listener trusts, about 4,000 per MB:
	# an issuer whose CRL does not fit is refused (no_crl_for_issuer), never
	# served on a partial list. Size it to the largest CRLs you load.
	lua_shared_dict migration_crl 32m;

	# -----------------------------------------------------------------------
	# Public enrollment DoS mitigation (:8443/enroll)
	# Enrollment is public (no client cert by design) and CPU-expensive on the
	# backend (CSR self-signature verify + `openssl ca` signing). Left
	# unbounded it is a cheap DoS vector. Enrollment is rare and human-driven,
	# so 5 req/min/IP with a small burst is generous for real use. Both zones
	# live in shared memory, NOT the rootfs, so they are compatible with the
	# read-only container filesystem.
	# -----------------------------------------------------------------------
	limit_req_zone  $binary_remote_addr zone=pqc_enroll:10m      rate=5r/m;
	limit_conn_zone $binary_remote_addr zone=pqc_enroll_conn:10m;

	# PQC Header Buffer Tuning: Support large ML-DSA-65 certificates (~10KB Base64)
	large_client_header_buffers 4 32k;

	# Light per-IP rate limit for the public enrollment page (port 8443) GETs.
	# Bursty (see burst=... nodelay in the location) so a single page load's handful
	# of asset requests isn't throttled; guards against trivial page hammering.
	limit_req_zone $binary_remote_addr zone=enroll_page:1m rate=30r/s;
	# /renew on the mTLS listener (item 4): per client certificate and per address.
	# A client renews once per lifetime; 6/min per serial leaves room for retries.
	limit_req_zone $ssl_client_serial zone=pqc_renew_serial:1m rate=6r/m;
	limit_req_zone $binary_remote_addr zone=pqc_renew_ip:1m rate=30r/m;

	# -----------------------------------------------------------------------
	# Quantum Slowloris Mitigation
	# The 4×32 KB header buffers above are needed for ML-DSA-65 certs but
	# make memory-exhaustion attacks cheap if connections can linger.
	# These three directives impose strict temporal bounds so slow/stalled
	# clients are dropped before they can exhaust worker memory.
	# -----------------------------------------------------------------------
	client_header_timeout 5s; # Drop if full request header not received in 5 s (→ HTTP 408)
	# Set at http{} level so BOTH 443 and 8443 inherit it, not just the 8081
	# control-plane block, stopping slow-body slowloris against the
	# public-facing enrollment/mTLS listeners too.
	client_body_timeout 5s; # Drop if request body stalls for 5 s

	# Keep all temporary buffers on writable tmpfs when rootfs is read-only.
	client_body_temp_path /var/cache/nginx/client_temp;
	proxy_temp_path /var/cache/nginx/proxy_temp;
	fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
	uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
	scgi_temp_path /var/cache/nginx/scgi_temp;

	init_by_lua_block {
		local meta = ngx.shared.pqc_route_meta
		if not meta:get("version") then
		meta:set("version", "0")
		meta:set("updated_at", "bootstrap")
		meta:set("checksum", "")
		end

		-- Reload persisted routes at startup so routing survives a gateway
		-- restart/crash instead of failing closed (403 no_routes_loaded) until
		-- the management-api happens to re-push. control_plane.lua writes this
		-- file atomically on every accepted /update-routes.
		local routes_path = "/var/cache/pqc-gw/routes/routes.json"
		local rf = io.open(routes_path, "r")
		if rf then
		local rdata = rf:read("*a")
		rf:close()
		if rdata and #rdata > 0 then
		local cjson = require("cjson.safe")
		local decoded = cjson.decode(rdata)
		if decoded and type(decoded.clients) == "table" then
		ngx.shared.pqc_routes:set("routes:json", rdata)
		meta:set("version", "restored")
		meta:set("updated_at", "startup-reload")
		else
		ngx.log(ngx.ERR, "[pqc-gw] persisted routes file invalid, not loaded")
		end
		end
		end

		-- Load the three RSA signing keys from the Docker secrets injected at
		-- runtime (three separate signing keys, not one shared key
		-- across purposes). Using runtime
		-- secrets means the private keys never appear in any image layer; the
		-- image only carries the public JWKS endpoint. Each is loaded into its
		-- own shared-dict slot so a suspected-compromised key can be rotated
		-- independently without invalidating tokens signed by the other two.
		local function load_signing_key(key_path, dict_slot)
		local f, open_err = io.open(key_path, "r")
		if not f then
		error("[pqc-gw] Cannot open JWT signing key " .. key_path .. ": " .. (open_err or "unknown error"))
		end
		local pem = f:read("*a")
		f:close()
		if not pem or #pem < 64 then
		error("[pqc-gw] JWT signing key at " .. key_path .. " is empty or too short, refusing to start")
		end
		meta:set(dict_slot, pem)
		end

		-- Token 1 (backend attestation, aud=pqc-backend, kid=backend-v1), the
		-- existing key/secret, renamed from jwt_key for clarity now that there
		-- are three.
		load_signing_key("/run/secrets/gateway-signing-key", "jwt_key_backend")
		-- Token for /admin/ (aud=pqc-mtls-management-api, kid=admin-v1).
		load_signing_key("/run/secrets/gateway-signing-key-admin", "jwt_key_admin")
		-- Token 2 (cert-lookup, aud=pqc-cert-lookup, kid=lookup-v1).
		load_signing_key("/run/secrets/gateway-signing-key-lookup", "jwt_key_lookup")

		-- The /admin/ token's signer (ADR-022). admin-v1 = RS256 with the key
		-- above; admin-v2 = ML-DSA-65 with its own key, which must load, be
		-- ML-DSA-65 and pass a sign/verify self-test, or the gateway does not
		-- start (an unusable key would otherwise fail every admin request). The
		-- admin-v2 key is read only when it signs; the JWKS publishes its public
		-- key whenever the file exists (docker/gateway/entrypoint.sh).
		local admin_kid = os.getenv("ADMIN_JWT_KID")
		if admin_kid == nil or admin_kid == "" then admin_kid = "admin-v1" end
		if admin_kid ~= "admin-v1" and admin_kid ~= "admin-v2" then
		error("[pqc-gw] ADMIN_JWT_KID must be admin-v1 or admin-v2, got '" .. admin_kid .. "'")
		end
		if admin_kid == "admin-v2" then
		local v2_path = "/run/secrets/gateway-signing-key-admin-v2"
		local vf, verr = io.open(v2_path, "r")
		if not vf then
		error("[pqc-gw] ADMIN_JWT_KID=admin-v2 but " .. v2_path .. " cannot be opened: " .. tostring(verr))
		end
		local v2_pem = vf:read("*a")
		vf:close()
		local ok, kerr = require("jwt_mldsa").check_key(v2_pem)
		if not ok then
		error("[pqc-gw] admin-v2 signing key unusable: " .. tostring(kerr))
		end
		meta:set("jwt_key_admin_v2", v2_pem)
		end
		meta:set("admin_jwt_kid", admin_kid)
		ngx.log(ngx.NOTICE, "[pqc-gw] admin token signer: ", admin_kid)

		-- Load the HMAC shared secret used to authenticate /update-routes.
		-- The management-api computes HMAC-SHA256(body) and sends it as
		-- X-Hub-Signature-256; control_plane.lua verifies it here.
		local hmac_path = "/run/secrets/control-plane-hmac"
		local hf, hmac_err = io.open(hmac_path, "r")
		if not hf then
		error("[pqc-gw] Cannot open control-plane HMAC secret " .. hmac_path .. ": " .. (hmac_err or "unknown error"))
		end
		local hmac_secret = hf:read("*a")
		hf:close()
		-- Strip trailing whitespace/newline that text editors may append.
		hmac_secret = hmac_secret:gsub("%s+$", "")
		if not hmac_secret or #hmac_secret < 16 then
		error("[pqc-gw] Control-plane HMAC secret at " .. hmac_path .. " is too short, refusing to start")
		end
		meta:set("cp_hmac_key", hmac_secret)

		-- Load the HMAC shared secret used to sign the /enroll -> management-api
		-- proxy hop. enroll_sign.lua computes
		-- HMAC-SHA256(secret, timestamp+method+uri+body) here; management-api's
		-- EnrollHmacGuard verifies it. Deliberately a SEPARATE secret from
		-- cp_hmac_key/custodian-hmac -- same "don't cross trust domains" reasoning.
		local enroll_hmac_path = "/run/secrets/enroll-hmac"
		local ehf, enroll_hmac_err = io.open(enroll_hmac_path, "r")
		if not ehf then
		error("[pqc-gw] Cannot open enroll HMAC secret " .. enroll_hmac_path .. ": " .. (enroll_hmac_err or "unknown error"))
		end
		local enroll_hmac_secret = ehf:read("*a")
		ehf:close()
		enroll_hmac_secret = enroll_hmac_secret:gsub("%s+$", "")
		if not enroll_hmac_secret or #enroll_hmac_secret < 16 then
		error("[pqc-gw] Enroll HMAC secret at " .. enroll_hmac_path .. " is too short, refusing to start")
		end
		meta:set("enroll_hmac_key", enroll_hmac_secret)

		-- renew-hmac (item 4): attests the mTLS client on the /renew -> management-api
		-- hop (renew_attest.lua / RenewAttestGuard). Optional: without it the gateway
		-- starts normally and /renew answers 503, so a host without the secret is
		-- not taken down by this file.
		local rhf = io.open("/run/secrets/renew-hmac", "r")
		if rhf then
		local renew_hmac_secret = (rhf:read("*a") or ""):gsub("%s+$", "")
		rhf:close()
		-- Empty (or a directory Docker created for a missing bind source): treat
		-- as not configured rather than refusing to start.
		if #renew_hmac_secret == 0 then
		ngx.log(ngx.WARN, "[pqc-gw] /run/secrets/renew-hmac is empty; /renew will answer 503")
		elseif #renew_hmac_secret < 16 then
		error("[pqc-gw] Renew HMAC secret at /run/secrets/renew-hmac is too short, refusing to start")
		else
		meta:set("renew_hmac_key", renew_hmac_secret)
		end
		end

		-- Migration listener inventory key (optional; without it the inventory is
		-- not served). Its own secret: reading the inventory must not also allow
		-- signing /update-routes. Read here, as root, like the secrets above.
		local ihf = io.open("/etc/nginx/migration/inventory-hmac.key", "r")
		if ihf then
		local inventory_key = (ihf:read("*a") or ""):gsub("%s+$", "")
		ihf:close()
		if #inventory_key >= 16 then
		meta:set("migration_inventory_key", inventory_key)
		else
		ngx.log(ngx.ERR, "[pqc-gw] migration inventory key is shorter than 16 bytes; inventory not served")
		end
		end
	}

	init_worker_by_lua_block {
		if ngx.worker.id() == 0 then
		local crl = require("crl_worker")
		crl.start_polling()
		-- Migration listener policy (absent file: everyone is observed). Under pcall
		-- so that a failure here is logged and cannot stop anything else.
		-- Its revocation poller (per issuer) starts only if the listener is configured.
		local ok, err = pcall(function()
			require("migration").load_policy("/etc/nginx/migration/policy.json")
		end)
		if not ok then ngx.log(ngx.ERR, "[migration] policy not loaded: ", err) end
		ok, err = pcall(function() require("migration_crl").start() end)
		if not ok then ngx.log(ngx.ERR, "[migration] CRL poller not started: ", err) end
		end
	}


	server {
		listen 8081 ssl;
		server_name gateway-control-plane;

		# The internal control channel (JWKS fetch + HMAC route push) is served
		# over TLS so the management-api can authenticate the gateway and a
		# spoofed JWKS response cannot substitute the JWT verification key.
		# ML-DSA-65 leaf from the ML-DSA-65 internal CA (ADR-022, supersedes the
		# RSA certificate of ADR-009): Node 22's bundled OpenSSL 3.5 validates
		# it, and management-api pins that CA through NODE_EXTRA_CA_CERTS. TLS
		# 1.3 only (1.2 cannot carry ML-DSA) and the hybrid group only, enforced
		# here rather than left to what a client happens to offer. ONE
		# certificate on purpose: the rollback RSA certificate scripts/setup-pki.sh
		# keeps on disk (internal-tls-rsa.*) must never be a second
		# ssl_certificate, or nginx would serve RSA to any client that does not
		# offer mldsa65.
		ssl_certificate     /etc/ssl/pqc/internal-tls.crt;
		ssl_certificate_key /etc/ssl/pqc/internal-tls.key;
		ssl_protocols TLSv1.3;
		ssl_conf_command Groups X25519MLKEM768;

		# 10.0.0.0/8 removed, far broader than this deployment's Docker networks
		# actually need. Only loopback and the RFC-1918 Docker ranges may reach
		# the control plane.
		allow 127.0.0.1;
		allow 172.16.0.0/12;
		# Docker's default address pools continue in 192.168.0.0/16 once 172.16/12
		# is used up; without this, management-api cannot fetch the JWKS on such a
		# host and every admin call answers 401 (seen 2026-10-27). This port is
		# never published; what it serves is public (JWKS, health, metrics) or
		# HMAC-authenticated (routes, inventory).
		allow 192.168.0.0/16;
		deny all;

		client_max_body_size 1m;
		keepalive_timeout 5s;

		location = /update-routes {
			limit_except POST {
				deny all;
			}
			content_by_lua_file /etc/nginx/lua/control_plane.lua;
		}

		location = /healthz {
			default_type application/json;
			content_by_lua_block {
				ngx.say('{"status":"ok","mode":"control-plane"}')
			}
		}

		# JWKS endpoint, serves the gateway's public keys for JWT verification
		# (RSA entries, plus the ML-DSA-65 "AKP" entry admin-v2, RFC 9964).
		# Accessible only on the internal control-plane port (8081), which is
		# restricted to RFC-1918 ranges by the allow/deny rules above.
		location = /.well-known/jwks.json {
			default_type application/json;
			add_header Cache-Control "public, max-age=3600";
			add_header X-Content-Type-Options "nosniff";
			alias /tmp/jwks.json;
		}

		# Prometheus metrics. Same listener as the JWKS endpoint and therefore
		# under the same allow/deny restriction: this exposes liveness, not
		# secrets, but there is no reason to widen its reach beyond the control
		# plane.
		#
		# pqc_crl_age_seconds says when the CRL layer stops working. An age
		# climbing without bound is visible whatever the cause (a bad openssl
		# path, a corrupt CRL, a dead timer). -1 means the poller has not
		# completed a successful cycle since start, which is distinct from
		# "0 seconds ago".
		location = /metrics {
			content_by_lua_block {
				local last = ngx.shared.pqc_route_meta:get("crl_last_update")
				local age  = last and (ngx.now() - last) or -1
				ngx.header["Content-Type"] = "text/plain; version=0.0.4"
				ngx.say("# HELP pqc_crl_age_seconds Seconds since the CRL worker last confirmed a good CRL; -1 if it never has.")
				ngx.say("# TYPE pqc_crl_age_seconds gauge")
				ngx.say(string.format("pqc_crl_age_seconds %.3f", age))
			}
		}

		# Migration listener inventory: one record per client identity and endpoint
		# (lua/migration.lua). It names clients, so beyond this listener's allow/deny
		# it needs an HMAC under its own key (X-Timestamp, X-Hub-Signature-256);
		# without the key (config/nginx/migration/README.md) it answers 503.
		location = /migration/inventory {
			limit_except GET { deny all; }
			content_by_lua_block {
				local migration = require("migration")
				ngx.header["Content-Type"] = "application/json"
				local ok, why = migration.inventory_authorized()
				if not ok then
					local status = why == "no_key" and 503 or 401
					ngx.status = status
					ngx.say(why == "no_key" and '{"error":"inventory_key_not_configured"}' or '{"error":"unauthorized"}')
					return ngx.exit(status)
				end
				ngx.say(migration.inventory_json())
			}
		}

		} # end control-plane server (port 8081)

		server {
			listen 443 ssl;
			http2 on;
			server_name pqc-gw.local;

			ssl_certificate /etc/ssl/pqc/server-mldsa65.crt;
			ssl_certificate_key /etc/ssl/pqc/server-mldsa65.key;
			ssl_verify_client on;
			ssl_client_certificate /etc/pki/pqc-ca/hybrid-ca-chain.crt;
			ssl_crl /etc/pki/pqc-ca/hybrid-combined-crl.pem;
			ssl_verify_depth 2;
			ssl_protocols TLSv1.3;
			# Enforce hybrid post-quantum key exchange, no classical fallback.
			# X25519MLKEM768 = X25519 (classical) + ML-KEM-768 (FIPS 203).
			# Clients that cannot negotiate this group cannot complete the handshake.
			ssl_conf_command Groups X25519MLKEM768;
			# Restrict the CertificateRequest sigalgs to ML-DSA-65 only.
			# Without this, OpenSSL also advertises classical sigalgs (RSA, ECDSA)
			# in the CertificateRequest, so a classical-keyed client cert signed by
			# the intermediate would pass mTLS even though key exchange is PQ.
			# Enforces post-quantum-only CLIENT authentication.
			# NOTE: the SSL_CONF file-form command name is ClientSignatureAlgorithms
			# (not "ClientSigAlgs") and the value token is ML-DSA-65 (not the OID
			# form "id-ml-dsa-65"); both wrong forms make nginx fail to start under
			# OpenSSL 3.6.2 (SSL_CONF_cmd ... failed: unknown cmd name / bad value).
			ssl_conf_command ClientSignatureAlgorithms ML-DSA-65;

			# OCSP stapling for the ML-DSA-65 server leaf. Verified working with
			# OpenResty 1.27.1.2 / OpenSSL 3.6.2: nginx fetches, verifies the
			# ML-DSA-65 OCSP signature, and staples the ~15 KB response.
			# The cert AIA URI (http://ocsp.pqc-gw.local) is not resolvable here and
			# points at :80, so the responder (pqc-ocsp-pq:9080) is named explicitly.
			# Verify chain (responder cert -> intermediate -> root) is in ca-chain.crt.
			# resolver is already set at http{} level (127.0.0.11).
			ssl_stapling on;
			ssl_stapling_verify on;
			ssl_trusted_certificate /etc/pki/pqc-ca/ca-chain.crt;
			ssl_stapling_responder http://pqc-ocsp-pq:9080/;

			access_log /var/log/nginx/pqc-mtls-access.log pqc_json;
			error_log /var/log/nginx/pqc-mtls-error.log warn;
			# Handshake failures (key exchange, protocol version) never become a
			# request and nginx reports them only at `info`, e.g.
			#   SSL_do_handshake() failed (... no suitable key share) while SSL handshaking
			# Kept in their own file so the warn-level log above stays readable.
			error_log /var/log/nginx/pqc-mtls-handshake.log info;

			# TLS telemetry. Server level, not location level: requests refused
			# before a location is selected (no client certificate, failed
			# verification) must still be described in the access log.
			set $pqc_tls_group "";
			set $pqc_tls_client_sig "";
			set $pqc_tls_server_sig "";
			set $pqc_tls_client_key "";
			log_by_lua_file /etc/nginx/lua/tls_log.lua;
			# Names the reason when a ClientHello cannot be served (no
			# X25519MLKEM768, no TLS 1.3). Observes only; never rejects.
			ssl_client_hello_by_lua_file /etc/nginx/lua/tls_hello.lua;

			# Baseline security response headers (X-Content-Type-Options,
			# X-Frame-Options, Referrer-Policy). Set at server level so they are
			# inherited by every location below, none of which define their own
			# add_header, so inheritance is not reset.
			include /etc/nginx/security-headers.conf;
			# HSTS on the 443 server only: it is directly reachable in some
			# deployments. The :8443 enrollment port is API-only and not a
			# browser-navigable origin, so HSTS would be meaningless there.
			add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

			# Forward identity headers to backends
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Host $host;
			proxy_set_header X-Client-CN $ssl_client_s_dn;
			proxy_set_header X-Client-Serial $ssl_client_serial;
			proxy_set_header X-Client-Verify $ssl_client_verify;

			# Management API stays private on the Docker network.
			location /admin/ {
				access_by_lua_file /etc/nginx/lua/admin_jwt.lua;
				proxy_pass http://management-api:3000/api/admin/;
				#proxy_set_header X-PQC-CN         $ssl_client_s_dn;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header Host $host;
				proxy_connect_timeout 5s;
				proxy_read_timeout 30s;
			}

			# Certificate renewal (item 4, ADR-015). Exact match, outside /admin/;
			# the current certificate is the credential. renew_attest.lua refuses a
			# revoked certificate and a resumed session, then attests the client to
			# management-api. No proxy_set_header here, so the server-level ones
			# above still apply; the attestation headers are set in Lua.
			location = /renew {
				limit_req zone=pqc_renew_serial burst=2 nodelay;
				limit_req zone=pqc_renew_ip burst=5 nodelay;
				limit_req_status 429;
				client_max_body_size 64k;
				client_body_buffer_size 64k;
				access_by_lua_file /etc/nginx/lua/renew_attest.lua;
				proxy_pass http://management-api:3000/api/renew;
				proxy_connect_timeout 5s;
				proxy_read_timeout 30s;
			}

			# Main policy-enforced paths
			location ~ ^/(api|data|webhook|telemetry|status|reports)/ {
				set $pqc_backend "";
				set $pqc_cn "";
				set $pqc_org "";
				set $pqc_expiry "";
				set $pqc_days_left "";

				access_by_lua_file /etc/nginx/lua/policy_router.lua;
				proxy_pass $pqc_backend;
			}

        location / {
            # Revocation check here too: without it this location relied on
            # ssl_crl alone, which refreshes only on reload.
            access_by_lua_file /etc/nginx/lua/revocation_check.lua;
            root  /usr/share/nginx/html;
            index index.html;
        }
    }

    # ── Enrollment endpoint (port 8443) ─────────────────────────────────────────
    # Accepts CSR + enrollment token with NO TLS client certificate requirement.
    # The enrollment token (pre-issued by an admin) is the sole authorization.
    # Only proxies the sign endpoint, all other management routes remain on 443.
    server {
        listen 8443 ssl;
        http2 on;
        server_name pqc-gw.local;

        # POST-QUANTUM ONLY. The enrollment token crosses this channel, so it
        # gets the same server authentication and key exchange as :443: the
        # ML-DSA-65 leaf from the PQ hierarchy (clients verify it with
        # ca-chain.crt) and X25519MLKEM768 with no classical fallback. Client
        # certificates are still not requested; the token is the authorization.
        #
        # Consequence: in practice only clients on OpenSSL 3.5 or later can
        # enroll. Browsers as of 2026-10 (hybrid group, but no ML-DSA signature
        # scheme) and curl on OpenSSL 3.0 are refused in the handshake (see
        # bench/test-enroll-8443.sh); stock Java 21, Node with an OpenSSL older
        # than 3.5 and LibreSSL curl are expected to fail the same way. The
        # refusal comes before any HTTP request, so the token is never sent
        # (README.md, "Enrollment clients").
        #
        # Until 2026-10 this listener presented a classical ECDSA P-256 leaf
        # from enroll-classical-ca and accepted X25519 as a fallback, so that a
        # browser could load the enrollment page. To go back to that, take the
        # ssl_certificate, ssl_certificate_key and Groups lines of this server
        # block from config/nginx/nginx.conf at commit 87ad02a (and its
        # /enroll-ca.crt location if clients fetch that CA from here).
        # scripts/setup-pki.sh still generates the classical leaf, so it needs
        # no PKI change.
        ssl_certificate     /etc/ssl/pqc/server-mldsa65.crt;
        ssl_certificate_key /etc/ssl/pqc/server-mldsa65.key;
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768;

        # Same telemetry as :443: the pqc_json access log (kex, signature
        # algorithms), nginx's own handshake failures at `info`, and the
        # ClientHello hook naming the refusal reason. See the :443 server for
        # why each piece sits at server level. client_sig and client_key are
        # empty here: this listener requests no client certificate.
        access_log /var/log/nginx/pqc-enroll-access.log pqc_json;
        error_log /var/log/nginx/pqc-enroll-error.log warn;
        error_log /var/log/nginx/pqc-enroll-handshake.log info;
        set $pqc_tls_group "";
        set $pqc_tls_client_sig "";
        set $pqc_tls_server_sig "";
        set $pqc_tls_client_key "";
        # location = /enroll has its own log_by_lua (enroll_audit.lua), which
        # replaces this one there; enroll_audit.lua fills the same variables.
        log_by_lua_file /etc/nginx/lua/tls_log.lua;
        ssl_client_hello_by_lua_file /etc/nginx/lua/tls_hello.lua;

        # Baseline security response headers (no HSTS here, see 443 server).
        include /etc/nginx/security-headers.conf;

        # An enrollment page and its assets are served read-only from this dir when
        # one is mounted. This is the ONLY UI the public gateway will host; the admin
        # console must never be served here.
        root  /etc/nginx/enroll-ui;
        index enroll.html;

        location = /enroll {
            # Sign endpoint: POST only. A GET here must NOT reach the sign proxy,
            # the page is served by `location /` below.
            limit_except POST { deny all; }

            # Re-assert the baseline security headers here: the X-Negotiated-Group
            # add_header below would otherwise reset nginx's header inheritance and
            # drop the server-level security-headers include for this location.
            include /etc/nginx/security-headers.conf;

            # Public DoS mitigation, see limit_req_zone/limit_conn_zone in http{}.
            # burst=3 nodelay absorbs a small legitimate burst; excess is
            # rejected immediately with 429 rather than queued.
            limit_req         zone=pqc_enroll burst=3 nodelay;
            limit_req_status  429;
            limit_conn        pqc_enroll_conn 4;
            limit_conn_status 429;
            # A CSR + enrollment token is a few KB; 16k leaves ample headroom
            # while capping the body an unauthenticated caller can send here.
            client_max_body_size 16k;
            # Matches client_max_body_size so the body is always available in
            # memory to enroll_sign.lua below (ngx.req.get_body_data()) rather
            # than spilling to a temp file.
            client_body_buffer_size 16k;

            # Sign this specific proxy hop. Runs in the access
            # phase (before proxy_pass) so the signature covers exactly the bytes
            # forwarded to management-api, which verifies it before touching the
            # CA or consuming the enrollment token. Coexists with the log-phase
            # audit hook below (different, non-conflicting phases).
            access_by_lua_file /etc/nginx/lua/enroll_sign.lua;

            # Audit every enrollment attempt (the one public mutation) to a
            # dedicated NDJSON log on the rw audit volume. Runs in the log phase
            # so it never buffers or delays the proxied POST body.
            log_by_lua_file /etc/nginx/lua/enroll_audit.lua;

            proxy_pass         http://management-api:3000/api/admin/certs/sign;
            proxy_set_header   Content-Type    $http_content_type;
            proxy_set_header   Host            $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            # Best-effort: surface the negotiated KE group so EnrollApp can show
            # whether the browser leg was PQC. Empty if $ssl_curve is unpopulated.
            add_header X-Negotiated-Group $ssl_curve always;
        }

        # Serve the enrollment page and its assets (GET/HEAD). Multi-file bundle
        # with external scripts/styles -> default-src 'self' is sufficient (no
        # inline script/style, no CDN). Returns 404 when no bundle is mounted.
        location / {
            limit_except GET HEAD { deny all; }
            limit_req zone=enroll_page burst=20 nodelay;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri /enroll.html =404;
        }
    }
	# Migration listener(s): none unless config/nginx/migration/*.conf exists.
	include /etc/nginx/migration/*.conf;
}

# Stream listeners: none unless config/nginx/stream/*.conf exists. The central
# side of edge links (ADR-020), see config/nginx/stream/README.md.
stream {
	include /etc/nginx/stream/*.conf;
}
