# Baseline security response headers.
#
# Included at server level on the public-facing TLS server blocks (443 and
# 8443). `always` ensures the headers are emitted on error responses
# (404 / 429 / 5xx) too, not just 2xx/3xx.
#
# Deliberately NOT set here:
#   * Content-Security-Policy, the operator console is served by a separate
#     agent, which owns its own CSP. A gateway CSP would not protect the
#     console and would only risk breaking the data plane.
#   * Strict-Transport-Security, added on the 443 server only (see nginx.conf);
#     the :8443 enrollment port is API-only, not a browser-navigable origin.
add_header X-Content-Type-Options nosniff     always;
add_header X-Frame-Options        DENY        always;
add_header Referrer-Policy        no-referrer always;
