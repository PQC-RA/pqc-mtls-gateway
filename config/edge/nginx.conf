# Edge box (ADR-020 topology): the post-quantum mTLS SERVER beside legacy devices.
#
#   SCADA/historian -> central gateway (stream, PQ mTLS client)
#                      ==ML-DSA-65 + X25519MLKEM768, both sides verified==>
#                      edge box (this file) -> device (plain TCP, own port)
#
# Runs on the gateway image: nginx -c /etc/pqc-edge/nginx.conf. Files in
# /etc/pqc-edge: edge-server.crt/.key (ML-DSA-65, serverAuth, SAN = the name the
# central side dials), central-ca.pem (the CA that issued the central gateway's
# client certificate), allowed-clients.txt (SHA-256 fingerprints, lua/edge_allow.lua).
# See README.md here. The device must be reachable ONLY through this box (its own
# network port); otherwise the box adds an encrypted path, it does not protect
# the device.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-edge.pid;

events {
	worker_connections 256;
}

stream {
	lua_package_path "/etc/pqc-edge/lua/?.lua;/etc/nginx/lua/?.lua;;";
	lua_shared_dict edge_allow 1m;
	init_worker_by_lua_block {
		require("edge_allow").load("/etc/pqc-edge/allowed-clients.txt")
	}

	log_format pqc_edge_json escape=json
		'{"ts":"$time_iso8601","side":"edge","peer":"$remote_addr",'
		'"proto":"$ssl_protocol","group":"$ssl_curve","cipher":"$ssl_cipher",'
		'"client_dn":"$ssl_client_s_dn","client_serial":"$ssl_client_serial",'
		'"verify":"$ssl_client_verify","upstream":"$upstream_addr","status":$status,'
		'"bytes_in":$bytes_received,"bytes_out":$bytes_sent,"session_time":$session_time}';

	server {
		# One listener per device. The port the central side dials.
		listen 8502 ssl;

		ssl_certificate     /etc/pqc-edge/edge-server.crt;
		ssl_certificate_key /etc/pqc-edge/edge-server.key;
		ssl_protocols TLSv1.3;
		# Post-quantum on both sides, nothing else: key exchange, the box's own
		# signature, and the signature the central side must make with its key.
		ssl_conf_command Groups X25519MLKEM768;
		ssl_conf_command SignatureAlgorithms ML-DSA-65;
		ssl_conf_command ClientSignatureAlgorithms ML-DSA-65;
		ssl_verify_client on;
		ssl_client_certificate /etc/pqc-edge/central-ca.pem;
		ssl_verify_depth 3;
		# Every connection is a full handshake with full verification.
		ssl_session_tickets off;
		ssl_session_cache off;
		ssl_handshake_timeout 30s;

		# The CA issues other client certificates too: only listed identities
		# may reach the device.
		preread_by_lua_block {
			require("edge_allow").check()
		}

		# The device's address (a name is resolved once, at start; an unresolvable
		# one stops the box from starting).
		proxy_pass 192.0.2.20:502;
		proxy_connect_timeout 5s;
		# Modbus, IEC 104 and DNP3 sessions are long-lived and quiet.
		proxy_timeout 1h;

		access_log /var/log/nginx/pqc-edge.log pqc_edge_json;
	}
}
