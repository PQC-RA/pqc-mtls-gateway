# Test servers for the 2026-11-07 re-run: the live gateway TLS settings (public config/nginx/nginx.conf,
# the :443 server), one server per arm. Same image as the stand gateway: OpenResty 1.31.8.1, OpenSSL 3.6.5.
worker_processes 1;
pid /tmp/rerun-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    ssl_session_tickets on;
    ssl_session_timeout 5m;
    client_body_temp_path /tmp/rr_body; proxy_temp_path /tmp/rr_proxy; fastcgi_temp_path /tmp/rr_fcgi;
    uwsgi_temp_path /tmp/rr_uwsgi; scgi_temp_path /tmp/rr_scgi;
    server {                                   # post-quantum arm, as live
        listen 127.0.0.1:31443 ssl; http2 on; server_name pqc-gw.local;
        ssl_certificate /r/pki/pq/server.crt; ssl_certificate_key /r/pki/pq/server.key;
        ssl_verify_client on; ssl_client_certificate /r/pki/pq/ca-chain.crt; ssl_verify_depth 2;
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768;
        ssl_conf_command ClientSignatureAlgorithms ML-DSA-65;
        ssl_stapling on; ssl_stapling_file /r/pki/pq/server-ocsp.der;
        location / { return 404; }
    }
    server {                                   # classical twin: same settings, classical algorithms
        listen 127.0.0.1:31444 ssl; http2 on; server_name pqc-gw.local;
        ssl_certificate /r/pki/cl/server.crt; ssl_certificate_key /r/pki/cl/server.key;
        ssl_verify_client on; ssl_client_certificate /r/pki/cl/ca-chain.crt; ssl_verify_depth 2;
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519;
        ssl_conf_command ClientSignatureAlgorithms ECDSA+SHA256;
        ssl_stapling on; ssl_stapling_file /r/pki/cl/server-ocsp.der;
        location / { return 404; }
    }
    server {                                   # post-quantum arm, as live
        listen 127.0.0.1:31445 ssl; http2 on; server_name pqc-gw.local;
        ssl_certificate /r/pki/pq/server.crt; ssl_certificate_key /r/pki/pq/server.key;
        ssl_verify_client off; ssl_client_certificate /r/pki/pq/ca-chain.crt; ssl_verify_depth 2;
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768;
        ssl_conf_command ClientSignatureAlgorithms ML-DSA-65;
        ssl_stapling on; ssl_stapling_file /r/pki/pq/server-ocsp.der;
        location / { return 404; }
    }
    server {                                   # classical twin: same settings, classical algorithms
        listen 127.0.0.1:31446 ssl; http2 on; server_name pqc-gw.local;
        ssl_certificate /r/pki/cl/server.crt; ssl_certificate_key /r/pki/cl/server.key;
        ssl_verify_client off; ssl_client_certificate /r/pki/cl/ca-chain.crt; ssl_verify_depth 2;
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519;
        ssl_conf_command ClientSignatureAlgorithms ECDSA+SHA256;
        ssl_stapling on; ssl_stapling_file /r/pki/cl/server-ocsp.der;
        location / { return 404; }
    }
}
